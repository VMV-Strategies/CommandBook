<!doctype html>
<html lang="en-CA">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Command Notebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Learn and practise IC200 and IC300 incident command.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Command">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: iOS inset-grouped lists under a sticky large-title navigation bar, persistent 3-tab bar fixed to the bottom edge. */
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --cell-press:#E5E5EA; --sheet-bg:#F2F2F7; --sheet-cell:#FFFFFF;
  --label:#000000; --label2:#6C6C70; --label3:#A2A2A7; --sep:rgba(60,60,67,.29);
  --fill:rgba(118,118,128,.12); --seg-sel:#FFFFFF;
  --tint:#007AFF; --tint-text:#0062CC; --tint-fill:#0071E3; --on-tint:#FFFFFF; --tint-soft:rgba(0,122,255,.10);
  --good:#1F7A35; --warn:#A64B00; --bad:#C7001A;
  --bar:rgba(249,249,249,.92); --shadow:rgba(0,0,0,.10);
  --sa-top:env(safe-area-inset-top,0px); --sa-bottom:env(safe-area-inset-bottom,0px);
  --sa-left:env(safe-area-inset-left,0px); --sa-right:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --tabbar-space:56px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --cell-press:#3A3A3C; --sheet-bg:#1C1C1E; --sheet-cell:#2C2C2E;
  --label:#FFFFFF; --label2:#AEAEB2; --label3:#6E6E73; --sep:rgba(84,84,88,.65);
  --fill:rgba(118,118,128,.24); --seg-sel:#636366;
  --tint:#0A84FF; --tint-text:#4DA3FF; --tint-fill:#0A6FE0; --on-tint:#FFFFFF; --tint-soft:rgba(10,132,255,.20);
  --good:#32D74B; --warn:#FF9F0A; --bad:#FF6961;
  --bar:rgba(22,22,24,.92); --shadow:rgba(0,0,0,.5); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --cell-press:#3A3A3C; --sheet-bg:#1C1C1E; --sheet-cell:#2C2C2E;
  --label:#FFFFFF; --label2:#AEAEB2; --label3:#6E6E73; --sep:rgba(84,84,88,.65);
  --fill:rgba(118,118,128,.24); --seg-sel:#636366;
  --tint:#0A84FF; --tint-text:#4DA3FF; --tint-fill:#0A6FE0; --on-tint:#FFFFFF; --tint-soft:rgba(10,132,255,.20);
  --good:#32D74B; --warn:#FF9F0A; --bad:#FF6961;
  --bar:rgba(22,22,24,.92); --shadow:rgba(0,0,0,.5); color-scheme:dark; }

/* Dynamic Type: on iOS this follows Settings › Display & Brightness › Text Size. Everything below is in rem. */
html{font-size:17px; -webkit-text-size-adjust:100%; text-size-adjust:100%}
@supports (font: -apple-system-body){ html{font:-apple-system-body} }
:root{padding-top:var(--sa-top); padding-bottom:var(--sa-bottom)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--label); font-family:var(--font); font-size:1rem; line-height:1.35;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden}
body::before{content:""; position:fixed; inset:0 0 auto; height:var(--sa-top); z-index:30; background:var(--bg); transition:background .2s}
body.nav-scrolled::before{background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px)}
button,input,textarea,select{font:inherit; color:inherit}
a{color:var(--tint-text)}
.sr-only{position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
:focus-visible{outline:3px solid var(--tint); outline-offset:2px; border-radius:8px}

.ic{width:24px; height:24px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round}
.ic.sm{width:18px; height:18px}
.ic.xs{width:14px; height:14px; stroke-width:2.2}

/* Navigation bar */
.navbar{position:sticky; top:var(--sa-top); z-index:20; background:var(--bg);
  padding-left:max(8px,var(--sa-left)); padding-right:max(8px,var(--sa-right)); transition:background .2s, box-shadow .2s}
.navbar.scrolled,.navbar.inline{background:var(--bar); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); box-shadow:0 .5px 0 var(--sep)}
.nav-inner{display:grid; grid-template-columns:minmax(max-content,1fr) minmax(0,auto) minmax(max-content,1fr); align-items:center; column-gap:6px; min-height:44px; max-width:720px; margin:0 auto}
.nav-title{font-weight:600; font-size:1rem; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; opacity:0; transition:opacity .15s}
.navbar.scrolled .nav-title,.navbar.inline .nav-title{opacity:1}
.nav-side{display:flex; min-width:0}
.nav-side.right{justify-content:flex-end}
.nav-btn{display:inline-flex; align-items:center; gap:2px; min-height:44px; min-width:44px; padding:0 8px; border:0; background:none;
  color:var(--tint-text); font-size:1rem; text-decoration:none; cursor:pointer; white-space:nowrap; max-width:100%}
.nav-btn span{overflow:hidden; text-overflow:ellipsis}
.nav-btn .ic{width:22px; height:22px; stroke-width:2.2; margin-left:-4px}
.nav-btn:active{opacity:.4}

/* Content column */
main{display:block; padding-left:max(16px,var(--sa-left)); padding-right:max(16px,var(--sa-right));
  padding-block:0 calc(var(--tabbar-space) + 28px)}
main:focus{outline:none}
.col{max-width:680px; margin:0 auto; display:flex; flex-direction:column}
.large-title{font-size:2rem; line-height:1.15; font-weight:700; letter-spacing:.01em; margin:2px 0 0; text-wrap:balance}
.title1{font-size:1.65rem; line-height:1.18; font-weight:700; margin:2px 0 0; text-wrap:balance}
.title2{font-size:1.3rem; line-height:1.2; font-weight:700; margin:4px 0 0; text-wrap:balance}
h1:focus{outline:none}
h1:focus-visible{outline:3px solid var(--tint)}
.eyebrow{margin:6px 0 0; font-size:.765rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--label2)}
.lede{margin:6px 0 0; color:var(--label2); font-size:.94rem; max-width:62ch}
.group-header{margin:26px 16px 7px; font-size:.765rem; font-weight:400; letter-spacing:.03em; text-transform:uppercase; color:var(--label2)}
.group-footer{margin:7px 16px 0; font-size:.765rem; color:var(--label2); line-height:1.35}
.gap{height:18px}

/* Grouped list */
.group{background:var(--cell); border-radius:12px; overflow:hidden; margin:0}
.group+.group{margin-top:18px}
.row{position:relative; display:flex; align-items:center; gap:12px; width:100%; min-height:44px; padding:11px 16px;
  margin:0; border:0; background:none; color:var(--label); text-align:left; text-decoration:none; font-size:1rem; cursor:pointer}
.row:where(a,button,label):active{background:var(--cell-press)}
.row+.row::before{content:""; position:absolute; top:0; right:0; left:16px; height:.5px; background:var(--sep)}
.row.has-icon+.row::before,.row.has-icon+.row.has-icon::before{left:52px}
.row:focus-visible{outline-offset:-3px; border-radius:12px}
.row-icon{color:var(--tint); display:flex}
.row-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.row-title{font-size:1rem}
.row-title.strong{font-weight:600}
.row-sub{font-size:.882rem; color:var(--label2)}
.row-detail{flex:none; max-width:46%; text-align:right; color:var(--label2); font-size:1rem}
.chev{color:var(--label3); width:14px; height:14px; stroke-width:2.4; flex:none}
.row.static{cursor:default}
.row.term{flex-direction:column; align-items:flex-start; gap:2px}
.row.term dd{margin:0}
.danger-left,.danger-left .row-icon{color:var(--bad)}
.row.danger{color:var(--bad); justify-content:center}
.row.action{color:var(--tint-text)}
.row.center{justify-content:center; text-align:center}
.badge{flex:none; min-width:1.6rem; padding:1px 8px; border-radius:99px; background:var(--tint-fill); color:var(--on-tint);
  font-size:.882rem; font-weight:600; text-align:center; font-variant-numeric:tabular-nums}
.badge.zero{background:var(--fill); color:var(--label2)}

/* Continue-learning hero row */
.hero .row{padding:16px; gap:14px}
.hero-icon{flex:none; width:46px; height:46px; border-radius:50%; background:var(--tint-fill); color:var(--on-tint); display:grid; place-items:center}
.hero-icon .ic{width:22px; height:22px; margin-left:2px}
.row-kicker{font-size:.882rem; font-weight:600; color:var(--tint-text)}
.hero .row-title{font-size:1.12rem; font-weight:600; line-height:1.25}

/* Status (shape + text, never colour alone) */
.status{display:inline-flex; align-items:center; gap:5px}
.st-done{color:var(--good)} .st-prog{color:var(--warn)} .st-none{color:var(--label2)}
.status .lbl{color:var(--label2)}

/* Segmented control */
.seg{display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:2px; margin:16px 0 0; border:0; border-radius:10px; background:var(--fill); min-width:0}
.seg legend{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
.seg label{position:relative; display:block}
.seg input{position:absolute; inset:0; opacity:0; margin:0; width:100%; height:100%; cursor:pointer}
.seg span{display:flex; align-items:center; justify-content:center; min-height:44px; border-radius:8px; font-size:.94rem; font-weight:500; font-variant-numeric:tabular-nums}
.seg input:checked+span{background:var(--seg-sel); font-weight:600; box-shadow:0 1px 3px var(--shadow), 0 0 0 .5px var(--sep)}
.seg input:focus-visible+span{outline:3px solid var(--tint); outline-offset:1px}
.seg-wrap{min-height:44px}

/* Explain row */
.explain{margin-top:16px}
.explain .row{min-height:44px}
.explain .value{color:var(--tint-text); font-weight:500}
.explain .ic{color:var(--tint-text)}

/* Prose */
.prose{margin-top:22px; max-width:62ch}
.prose h2{font-size:1.18rem; font-weight:600; margin:0 0 6px; text-wrap:balance}
.prose p{margin:0 0 10px; line-height:1.5}
.prose ul{margin:0 0 10px; padding-left:1.2em; line-height:1.5}

/* Cards: only where content belongs together */
.card{background:var(--cell); border-radius:14px; padding:14px 16px; min-width:0}
.card h2,.card h3{margin:0; font-size:.882rem; font-weight:600; display:flex; align-items:center; gap:8px; color:var(--label2); text-transform:uppercase; letter-spacing:.03em}
.card h2 .ic,.card h3 .ic{color:var(--tint)}
.explained{margin-top:18px; background:var(--tint-soft)}
.explained p{margin:6px 0 0; line-height:1.5}
.pair{display:grid; gap:12px; margin-top:16px}
@media (min-width:720px){ .pair{grid-template-columns:1fr 1fr} }
.brief dl{margin:8px 0 0}
.brief dt{font-size:.82rem; font-weight:600; margin-top:10px}
.brief dd{margin:2px 0 0; line-height:1.45; font-size:.94rem}
.log ol{list-style:none; margin:8px 0 0; padding:0}
.log li{display:grid; grid-template-columns:auto minmax(0,1fr); gap:2px 12px; padding:8px 0; border-top:.5px solid var(--sep); font-size:.94rem; line-height:1.4}
.log li:first-child{border-top:0}
.log time{font-family:var(--mono); font-size:.85rem; font-variant-numeric:tabular-nums; color:var(--label2); padding-top:1px}
.log .who{font-weight:600}
.new-pill{display:inline-block; margin-left:6px; padding:0 6px; border-radius:5px; border:1px solid var(--tint-text); color:var(--tint-text); font-size:.7rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; vertical-align:1px}
.log li.is-new{background:var(--tint-soft); margin:0 -8px; padding-left:8px; padding-right:8px; border-radius:8px}

details.card{padding:0}
details.card summary{display:flex; align-items:center; gap:10px; min-height:48px; padding:10px 16px; cursor:pointer; list-style:none; color:var(--tint-text); font-weight:500}
details.card summary::-webkit-details-marker{display:none}
details.card summary .ic{transition:transform .2s}
details.card[open] summary .ic.chevd{transform:rotate(90deg)}
details.card .inner{padding:0 12px 12px}
details.card .inner .card{background:var(--bg)}

/* Scenario */
.stage-ind{margin:10px 0 0; font-size:.94rem; color:var(--label2)}
.stage-ind strong{color:var(--label); font-weight:600}
.stage-bar{display:grid; gap:4px; margin-top:8px}
.stage-bar i{display:block; height:4px; border-radius:2px; background:var(--fill)}
.stage-bar i.on{background:var(--tint)}
.task{margin-top:24px}
.task h2{font-size:1.18rem; font-weight:600; margin:0 0 4px; text-wrap:balance}
.task .hint{margin:0 0 10px; font-size:.882rem; color:var(--label2)}
.field{display:block; width:100%; min-height:7.5em; padding:12px 14px; border-radius:12px; border:1px solid var(--sep);
  background:var(--cell); resize:vertical; line-height:1.45; font-size:1rem}
.field:focus{outline:3px solid var(--tint); outline-offset:0; border-color:transparent}
.err{margin:8px 0 0; color:var(--bad); font-size:.882rem; display:flex; gap:6px; align-items:flex-start}
fieldset.opts{border:0; padding:0; margin:0; min-width:0}
fieldset.opts legend{padding:0; font-size:1.18rem; font-weight:600; margin-bottom:4px}
.opt{align-items:flex-start}
.opt input{position:absolute; opacity:0; width:1px; height:1px}
.mark{flex:none; width:24px; height:24px; margin-top:-1px; border-radius:50%; border:1.75px solid var(--label3); display:grid; place-items:center; color:transparent}
.mark.sq{border-radius:7px}
.opt input:checked~.mark{background:var(--tint-fill); border-color:var(--tint-fill); color:var(--on-tint)}
.opt input:focus-visible~.row-body{outline:3px solid var(--tint); outline-offset:4px; border-radius:4px}
.fb{margin-top:6px; font-size:.882rem; line-height:1.4; color:var(--label2)}
.fb .status{font-weight:600}
.result{margin-top:20px}
.result h2{font-size:1.18rem; font-weight:600; margin:0 0 8px}
.result .row{align-items:flex-start}
.score{font-variant-numeric:tabular-nums}

.actionbar{position:sticky; bottom:var(--tabbar-space); z-index:5; margin:24px calc(-1 * max(16px,var(--sa-left))) 0; padding:10px max(16px,var(--sa-right)) 10px max(16px,var(--sa-left));
  background:var(--bg)}
.actionbar.stuck{box-shadow:0 -.5px 0 var(--sep)}
.primary{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; padding:12px 20px; border:0; border-radius:14px;
  background:var(--tint-fill); color:var(--on-tint); font-size:1rem; font-weight:600; cursor:pointer; text-decoration:none; text-align:center}
.primary:active{filter:brightness(.88)}
.primary:focus-visible{outline:3px solid var(--tint); outline-offset:3px}
.secondary{display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; margin-top:10px; border:0; border-radius:14px;
  background:var(--tint-soft); color:var(--tint-text); font-size:1rem; font-weight:600; cursor:pointer}
body.kb-open .actionbar{position:static; background:none}
body.kb-open .tabbar{display:none}

/* Glossary highlight */
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{background:var(--tint-soft)}100%{background:transparent}}
dfn{font-style:normal; font-weight:600}

/* Review */
.rcard{margin-top:18px; padding:20px 18px; min-height:9rem}
.rcard .q{font-size:1.18rem; font-weight:600; line-height:1.3; margin:6px 0 0}
.rcard .a{margin:14px 0 0; padding-top:14px; border-top:.5px solid var(--sep); line-height:1.5}
.btn-pair{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.btn-pair .secondary,.btn-pair .primary{margin-top:0}

/* Tab bar */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); box-shadow:0 -.5px 0 var(--sep);
  padding:0 max(0px,var(--sa-right)) var(--sa-bottom) max(0px,var(--sa-left))}
.tabbar ul{display:grid; grid-template-columns:repeat(3,1fr); max-width:560px; margin:0 auto; padding:0; list-style:none}
.tab{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:49px; padding:5px 4px 4px;
  color:var(--label2); text-decoration:none; font-size:.66rem; font-weight:500; line-height:1.1}
.tab[aria-current="page"]{color:var(--tint)}
.tab[aria-current="page"] .ic{stroke-width:2.1}
.tab[aria-current="page"] .tab-lbl{font-weight:700}
.tab:focus-visible{outline-offset:-3px}

/* Bottom sheet */
dialog.sheet{position:fixed; inset:auto 0 0 0; margin:0 auto; width:100%; max-width:640px; max-height:88dvh; overflow:auto;
  border:0; border-radius:14px 14px 0 0; background:var(--sheet-bg); color:var(--label);
  padding:0 max(16px,var(--sa-right)) calc(20px + var(--sa-bottom)) max(16px,var(--sa-left)); box-shadow:0 -8px 30px var(--shadow)}
dialog.sheet[open]{animation:sheetUp .28s cubic-bezier(.2,.9,.3,1)}
dialog.sheet::backdrop{background:rgba(0,0,0,.4)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.grabber{width:36px; height:5px; border-radius:3px; background:var(--label3); margin:6px auto 4px}
.sheet-head{display:grid; grid-template-columns:1fr auto; align-items:center; gap:8px; margin-bottom:4px}
.sheet-head h2{margin:0; font-size:1.18rem; font-weight:700}
.sheet .group{background:var(--sheet-cell)}
.sheet .desc{margin:0 0 14px; color:var(--label2); font-size:.882rem; line-height:1.4}
.check{color:var(--tint); visibility:hidden}
[aria-checked="true"] .check{visibility:visible}
.sheet textarea{width:100%; min-height:9em; font-family:var(--mono); font-size:.8rem; border-radius:12px; border:1px solid var(--sep); background:var(--sheet-cell); padding:10px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important; scroll-behavior:auto!important}
}
@media (prefers-contrast: more){ :root{--sep:rgba(60,60,67,.6); --label2:#3C3C43} }
</style>

const LEVELS = {
  new:{name:"New to ICS", desc:"Plain language, with every term explained."},

const LEVEL_ORDER = ["new","dev","exp","inst"];

const LESSONS = [
 {id:"chain", track:"IC200", min:5, title:"Chain and unity of command",
  summary:"Who gives direction, and why every person on an incident reports to one supervisor.",
  sections:[
   {h:"What the terms mean", p:["Chain of command is the orderly line of authority within the incident organization. Unity of command means every person reports to one designated supervisor.","Together they keep assignments clear and prevent conflicting orders."]},
   {h:"Why it matters on scene", p:["Without unity of command a crew can receive two different assignments from two officers, and accountability breaks down.","Information can still flow freely across the organization. Only assignments and direction follow the chain."]}],
  explain:{
   new:"Think of it as one boss per person. If someone other than your supervisor gives you a new task, check with your supervisor before switching.",
   dev:"Information can move sideways: you can warn any crew about a hazard. Tasking moves down the chain. When you receive conflicting direction, say so and resolve it through your supervisor.",
   exp:"The common failure is the drive-by order, where a senior officer redeploys a crew without telling the supervisor who still thinks they have it. Route redeployments through the assigned supervisor and confirm accountability afterwards.",
   inst:"Ask learners to trace who each resource reports to on an ICS 203 and find the dual-reporting line. Watch for learners who confuse sharing information with issuing direction."},
  terms:["chain-of-command","unity-of-command","incident-commander"], scenario:"flood", sources:["is200","nims"]},
 {id:"span", track:"IC200", min:5, title:"Span of control",
  summary:"How many people one supervisor can manage well, and what to do when that number grows.",
  sections:[
   {h:"The guideline", p:["Span of control is the number of people or units one supervisor can manage effectively. NIMS describes an effective span as three to seven, with five as a common guideline."]},
   {h:"Adjusting it", p:["Hazardous, fast-moving or complex work calls for a narrower span. Routine, low-risk work in a small area can tolerate a wider one.","When the span grows beyond what you can manage, add a supervisory layer: groups, divisions or a section chief."]}],
  explain:{
   new:"If more than about seven people or crews report directly to you, give some of them a leader of their own.",
   dev:"Watch for the signs before the numbers: missed radio calls, crews waiting for assignments, and losing track of who is where.",
   exp:"Expand early. Establishing divisions while units are still arriving is far easier than restructuring once ten crews are talking to you on one channel.",
   inst:"Have learners count direct reports from a command log at each time stamp. Strong learners expand before the span is exceeded, not after."},
  terms:["span-of-control","division","group"], scenario:"flood", sources:["is200","nims"]},
 {id:"transfer", track:"IC200", min:6, title:"Transfer of command",
  summary:"When command changes hands, and the briefing that makes the change safe.",
  sections:[
   {h:"When it happens", p:["Command moves to another person when a more qualified person arrives, the incident changes in complexity, jurisdiction or agency responsibility changes, or the current IC needs relief, for example at a shift change."]},
   {h:"How to do it", p:["Whenever possible the incoming IC gets a face-to-face briefing, assesses the situation with the outgoing IC, and sets an effective time of transfer. Everyone on the incident is then told about the change.","The outgoing IC is usually reassigned rather than released, which keeps their knowledge on scene."]},
   {h:"What the briefing covers", list:["Situation status and hazards","Objectives and priorities","Current organization and assignments","Resources assigned and ordered","Facilities and communications","Safety concerns, using the ICS 201 if there is one"]}],
  explain:{
   new:"Taking over command is like a shift handover: listen, ask questions, agree on the exact time, and then make sure everyone hears who is in charge now.",
   dev:"Avoid accepting command over the radio while you are still driving in. Get the briefing in person, see the scene, then announce the time of transfer.",
   exp:"Ask the outgoing IC what they would do next and what worries them. Keep them in the organization, often as Operations or a division supervisor, so their situational awareness isn't lost.",
   inst:"Score the transfer as well as the final organization: did the learner set an effective time, confirm resources ordered, and notify all personnel?"},
  terms:["transfer-of-command","ics-201","incident-commander"], scenario:"takeover", sources:["is200","nims","icscanada"]},
 {id:"ics201", track:"IC200", min:5, title:"The initial incident briefing (ICS 201)",
  summary:"The form that captures the first operational period and anchors every handover.",
  sections:[
   {h:"What it is", p:["The ICS 201 Incident Briefing records the situation and the response for the initial period. It is used to brief incoming command and general staff, and it can serve as the initial action plan."]},
   {h:"What's on it", list:["An incident map or sketch","Situation summary and health and safety briefing","Current and planned objectives","Current and planned actions, strategies and tactics","Current organization","Resource summary"]}],
  explain:{
   new:"The 201 is a snapshot: what's happening, what we're trying to do, who is doing what, and what's on scene or coming.",
   dev:"Fill in the resource summary as units arrive, not at the end. It's the part incoming officers rely on most.",
   exp:"Use the 201 as the spine of your takeover briefing. If the sketch and the resource summary disagree, resolve that first.",
   inst:"Have learners brief from the 201 in under three minutes. Listen for objectives stated as outcomes rather than tasks."},
  terms:["ics-201","operational-period","incident-action-plan"], scenario:"flood", sources:["forms","is200"]},
 {id:"expand", track:"IC300", min:6, title:"Expanding the organization",
  summary:"Divisions, groups, branches and resource units for an incident that keeps growing.",
  sections:[
   {h:"Divisions, groups and branches", p:["Divisions divide an incident geographically. Groups divide it by function. Both are led by supervisors.","When divisions and groups exceed the Operations Section Chief's span of control, branches are added between them."]},
   {h:"Resource units", p:["A strike team combines resources of the same kind and type with a leader and common communications. A task force combines different kinds of resources for a particular need, also with a leader. Single resources report directly to a supervisor."]},
   {h:"Staging", p:["A staging area holds resources available for assignment, usually within minutes. The Staging Area Manager reports to the Operations Section Chief."]}],
  explain:{

  terms:["division","group","branch","strike-team","task-force","staging-area"], scenario:"takeover", sources:["ics300","nims"]},
 {id:"objectives", track:"IC300", min:7, title:"Objectives and the Planning P",

   {h:"The Planning P", p:["After the initial response and ICS 201 briefing, the planning cycle runs through these steps:"], list:["IC or Unified Command objectives meeting","Command and general staff meeting","Tactics meeting","Planning meeting","IAP preparation and approval","Operational period briefing","Execute the plan and assess progress, which feeds the next cycle"]}],
  explain:{

  sections:[

   {h:"Oral or written", p:["Small incidents can work from an oral plan. A written IAP is expected when several agencies or jurisdictions are involved, when the incident runs over several operational periods, or when hazardous materials are present."]}],
  explain:{

  terms:["incident-action-plan","ics-204","operational-period"], scenario:"takeover", sources:["forms","ics300"]},
 {id:"takeover-l", track:"IC300", min:6, title:"Taking over a growing incident",

  sections:[

   {h:"Assess, then reorganize", p:["Count direct reports. If the IC is supervising more than five to seven units, put Operations and divisions or groups in place before more resources arrive. Assign a Safety Officer once the hazards exceed what the IC can watch personally."]},
   {h:"Make the change visible", p:["Announce the effective time of transfer, any change to the command name, and the new reporting lines on the command channel."]}],
  explain:{

const GLOSSARY = [
 ["branch","Branch","The level between the Operations Section Chief and divisions or groups, added when span of control is exceeded. Led by a Branch Director."],
 ["chain-of-command","Chain of command","The orderly line of authority within the ranks of the incident organization."],
 ["division","Division","A geographic area of operations, such as one side of a building. Led by a Division Supervisor."],
 ["group","Group","A functional area of operations, such as medical or hazmat. Led by a Group Supervisor."],
 ["ics-201","ICS 201 Incident Briefing","The form recording the map, situation, objectives, actions, organization and resources for the initial response."],
 ["ics-204","ICS 204 Assignment List","Tells each division or group its assignment for the operational period."],
 ["incident-action-plan","Incident Action Plan (IAP)","An oral or written plan with the objectives and strategy for an operational period."],
 ["incident-commander","Incident Commander (IC)","The person responsible for all incident activities, including setting objectives and approving the plan."],
 ["management-by-objectives","Management by objectives","Setting measurable objectives, then strategies, tactics and assignments, and checking results."],
 ["operational-period","Operational period","The time scheduled for carrying out a set of actions in the IAP, often 12 or 24 hours."],
 ["par","PAR","Personnel accountability report: a roll call confirming every member of a unit is accounted for."],
 ["planning-p","Planning P","A model of the planning cycle used to build each IAP, named for its shape."],
 ["safety-officer","Safety Officer","A command staff member who monitors safety and can stop unsafe acts."],
 ["span-of-control","Span of control","The number of people or units one supervisor can manage effectively: generally three to seven, with five as a guideline."],
 ["staging-area","Staging area","A temporary location where resources wait for a tactical assignment."],
 ["strike-team","Strike team","A set number of resources of the same kind and type, with a leader and common communications."],
 ["task-force","Task force","A mix of resource kinds, with a leader and common communications, assembled for a specific mission."],
 ["transfer-of-command","Transfer of command","Moving responsibility for command from one IC to another, ideally after a face-to-face briefing and at a stated time."],
 ["unity-of-command","Unity of command","Each person reports to only one designated supervisor."]
];
const GL = Object.fromEntries(GLOSSARY.map(([id,t,d])=>[id,{id,t,d}]));

/* ---------- State ---------- */
const KEY = "command-notebook.v1";
const fresh = () => ({v:1, track:"IC300", level:"exp", lessons:{}, scen:{}, cards:{}, resume:{}, tabRoutes:{today:"today",learn:"learn",practise:"practise"}, scroll:{}, open:{}});
let S = (()=>{ try{ const r = localStorage.getItem(KEY); if(r) return Object.assign(fresh(), JSON.parse(r)); }catch(e){} return fresh(); })();
let saveTimer;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }, 120); }
function flush(){ clearTimeout(saveTimer); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
addEventListener("pagehide", flush);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flush(); });

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (id, cls="") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const chev = () => `<svg class="ic chev" aria-hidden="true"><use href="#i-chev-r"/></svg>`;
const L = id => LESSONS.find(l => l.id === id);
const trackLessons = t => LESSONS.filter(l => l.track === t);
const sc = id => { if(!S.scen[id]) S.scen[id] = {stage:0, ans:{}, checked:{}, done:false}; return S.scen[id]; };
const now = () => Date.now();
function announce(msg){ const el = document.getElementById("live"); el.textContent = ""; setTimeout(()=>{ el.textContent = msg; }, 30); }

function lessonStatus(id){ if(S.lessons[id]?.done) return "done"; if(S.lessons[id]?.opened) return "prog"; return "none"; }
function scenStatus(id){ const s = S.scen[id]; if(!s) return "none"; if(s.done) return "done"; return (s.stage>0 || Object.keys(s.ans).length) ? "prog" : "none"; }
const ST_TEXT = {done:"Completed", prog:"In progress", none:"Not started"};
const ST_ICON = {done:"done", prog:"prog", none:"none"};
const statusHTML = (st, extra="") => `<span class="status st-${st}">${icon(ST_ICON[st],"sm")}<span class="lbl">${ST_TEXT[st]}${extra}</span></span>`;

function dueCards(){ const t = now(); return CARDS.filter(c => c.track===S.track && (S.cards[c.id]?.due ?? 0) <= t); }

function resumeTarget(){
  const r = S.resume[S.track];
  if(r){
    if(r.type==="scenario" && SCENARIOS[r.id] && !S.scen[r.id]?.done){
      const SC = SCENARIOS[r.id], st = sc(r.id), stage = SC.stages[st.stage];
      return {href:"#scenario-"+r.id, title:SC.title, detail:`${stage.name} · ${st.stage+1} of ${SC.stages.length}`, kind:"Scenario"};
    }
    if(r.type==="lesson" && L(r.id) && !S.lessons[r.id]?.done){
      return lessonTarget(L(r.id));
    }
  }
  const next = trackLessons(S.track).find(l => !S.lessons[l.id]?.done);
  if(next) return lessonTarget(next);
  const scn = Object.values(SCENARIOS).find(s => s.track===S.track);
  const st = sc(scn.id);
  return {href:"#scenario-"+scn.id, title:scn.title, detail: st.done ? "Completed · run it again" : `${scn.stages[st.stage].name} · ${st.stage+1} of ${scn.stages.length}`, kind:"Scenario"};
}
function lessonTarget(l){ const ls = trackLessons(l.track); const i = ls.indexOf(l)+1;
  return {href:"#lesson-"+l.id, title:l.title, detail:`${l.track} lesson ${i} of ${ls.length} · ${l.min} min`, kind:"Lesson"}; }

/* ---------- Routing ---------- */
function parse(name){
  const fixed = {today:"today","app-settings":"settings",learn:"learn",glossary:"glossary",sources:"sources",practise:"practise",review:"review"};
  if(fixed[name]) return {v:fixed[name]};
  let m;
  if((m = /^lesson-(.+)$/.exec(name)) && L(m[1])) return {v:"lesson", id:m[1]};
  if((m = /^term-(.+)$/.exec(name)) && GL[m[1]]) return {v:"glossary", focus:"term-"+m[1]};
  if((m = /^source-(.+)$/.exec(name)) && SRC[m[1]]) return {v:"sources", focus:"src-"+m[1]};
  if((m = /^scenario-(.+)$/.exec(name)) && SCENARIOS[m[1]]) return {v:"scenario", id:m[1]};
  return null;
}
const TAB = {today:"today",settings:"today",learn:"learn",lesson:"learn",glossary:"learn",sources:"learn",practise:"practise",review:"practise",scenario:"practise"};
const PARENT = {settings:"today",lesson:"learn",glossary:"learn",sources:"learn",review:"practise",scenario:"practise"};
function titleOf(name){
  const r = parse(name); if(!r) return "Back";
  return ({today:"Today",settings:"Settings",learn:"Learn",glossary:"Glossary",sources:"Sources",practise:"Practise",review:"Review"})[r.v]
    || (r.v==="lesson" ? "Lesson" : r.v==="scenario" ? "Scenario" : "Back");
}
let cur = null;
function currentName(){ const h = decodeURIComponent(location.hash.slice(1)); return parse(h) ? h : "today"; }
function backTarget(){
  const r = parse(cur); const prev = history.state?.prev;
  if(prev && parse(prev) && TAB[parse(prev).v]===TAB[r.v] && prev!==cur) return {name:prev, viaHistory:true};
  const p = PARENT[r.v]; return p ? {name:p, viaHistory:false} : null;
}
function go(name, {replace=false} = {}){
  if(name===cur) return;
  saveScroll();
  const st = {prev:cur};
  if(replace) history.replaceState({prev:history.state?.prev ?? null}, "", "#"+name);
  else history.pushState(st, "", "#"+name);
  render({focus:true});
}
function goBack(){
  const b = backTarget(); if(!b) return;
  if(b.viaHistory) history.back(); else go(b.name, {replace:true});
}
addEventListener("popstate", ()=>{ render({focus:true}); });
if("scrollRestoration" in history) history.scrollRestoration = "manual";

let scrollRaf = 0;
function saveScroll(){ if(cur) { S.scroll[cur] = Math.round(scrollY); save(); } }
addEventListener("scroll", ()=>{ if(scrollRaf) return; scrollRaf = requestAnimationFrame(()=>{ scrollRaf=0; saveScroll(); }); }, {passive:true});

function explainHTML(){

    ${icon("updown","sm")}</button></div>`;
}
function row({href, act, iconId, title, sub, detail, badge, strong, ext, id, cls=""}){
  const tag = href ? "a" : act ? "button" : "div";
  const attrs = href ? `href="${href}"${ext?' target="_blank" rel="noopener"':''}` : act ? `type="button" data-act="${act}"` : "";
  return `<${tag} class="row ${iconId?"has-icon":""} ${tag==="div"?"static":""} ${cls}" ${attrs} ${id?`id="${id}"`:""}>
    ${iconId?`<span class="row-icon">${icon(iconId)}</span>`:""}
    <span class="row-body"><span class="row-title ${strong?"strong":""}">${title}</span>${sub?`<span class="row-sub">${sub}</span>`:""}</span>
    ${detail!=null?`<span class="row-detail">${detail}</span>`:""}
    ${badge!=null?badge:""}
    ${ext?icon("ext","sm"):(href?chev():"")}</${tag}>`;
}

    <section class="card brief" aria-labelledby="bh-${SC.id}"><h2 id="bh-${SC.id}">${icon("brief","sm")}ICS 201 briefing</h2>
      <dl>${SC.brief.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>
    <section class="card log" aria-labelledby="lh-${SC.id}"><h2 id="lh-${SC.id}">${icon("log","sm")}Command log</h2>${logHTML(false)}</section></div>`;
  let top = "";
  if(st.stage===0){ top = `<p class="lede" style="color:var(--label)">${esc(SC.role)}</p>${pair}`; }
  else {
    const open = !!S.open[SC.id];
    top = `<p class="lede" style="color:var(--label)">${esc(stage.intro)}</p>
    ${log.some(e=>e[0]===st.stage)?`<section class="card log" style="margin-top:16px" aria-labelledby="nh-${SC.id}"><h2 id="nh-${SC.id}">${icon("radio","sm")}${stage.kind==="debrief"?"Latest entry":"New in the command log"}</h2>${logHTML(true)}</section>`:""}
    <details class="card" style="margin-top:12px" id="ref-${SC.id}" ${open?"open":""}><summary>${icon("chev-r","sm chevd")}Briefing and full command log</summary><div class="inner">${pair}</div></details>`;
  }
  const checked = !!st.checked[st.stage];
  let task = "", result = "";
  const whyHTML = `<aside class="card explained" aria-labelledby="why-h"><h2 id="why-h">${icon("info","sm")}Why it matters · ${esc(LEVELS[S.level].name)}</h2><p>${esc(stage.why[S.level])}</p></aside>`;
  if(stage.kind==="text"){
    const v = st.ans[st.stage] || "";
    task = `<div class="task"><h2 id="tp">${esc(stage.prompt)}</h2><p class="hint" id="th">${esc(stage.hint)}</p>
      <label class="sr-only" for="ans-${SC.id}-${st.stage}">${esc(stage.label)}</label>
      <textarea class="field" id="ans-${SC.id}-${st.stage}" data-ans="${SC.id}" aria-describedby="tp th" placeholder="${esc(stage.placeholder)}" rows="5">${esc(v)}</textarea>
      <div id="err" aria-live="polite"></div></div>`;
    if(checked){ const cov = textCoverage(stage, v);
      result = `<section class="result" aria-labelledby="res-h"><h2 id="res-h" tabindex="-1">${esc(stage.resultTitle)} <span class="score">· ${cov.filter(Boolean).length} of ${cov.length} covered</span></h2>
      <div class="group">${stage.model.map((m,i)=>`<div class="row static"><span class="status st-${cov[i]?"done":"none"}">${icon(cov[i]?"done":"miss")}</span><span class="row-body"><span class="row-title">${esc(m.t)}</span><span class="row-sub">${cov[i]?"Covered in your answer":"Not mentioned"}</span></span></div>`).join("")}</div>${whyHTML}</section>`; }
  } else if(stage.kind==="choice" || stage.kind==="multi"){
    const multi = stage.kind==="multi"; const a = st.ans[st.stage] ?? (multi?[]:null);
    task = `<div class="task"><fieldset class="opts"><legend>${esc(stage.prompt)}</legend>${stage.hint?`<p class="hint">${esc(stage.hint)}</p>`:""}
      <div class="group">${stage.options.map((o,i)=>{ const on = multi ? a.includes(i) : a===i; const oid=`opt-${SC.id}-${st.stage}-${i}`;
        let fb = "";
        if(checked){
          if(multi){ fb = on===o.ok ? `<span class="status st-done">${icon("done","xs")}${o.ok?"Confirm this":"Right to skip"}</span>` : `<span class="status st-none">${icon("miss","xs")}${o.ok?"You missed this":"Not needed"}</span>`; if(o.fb && on) fb += ` ${esc(o.fb)}`; }
          else if(on){ fb = `<span class="status ${o.ok?"st-done":"st-none"}">${icon(o.ok?"done":"miss","xs")}${o.ok?"Strong choice.":"Reconsider."}</span> ${esc(o.fb)}`; }
          else if(o.ok){ fb = `<span class="status st-done">${icon("done","xs")}Recommended.</span> ${esc(o.fb)}`; }
        }
        return `<label class="row opt" for="${oid}"><input type="${multi?"checkbox":"radio"}" name="o-${SC.id}-${st.stage}" id="${oid}" value="${i}" data-opt="${SC.id}" ${on?"checked":""}>
          <span class="mark ${multi?"sq":""}">${icon("check","xs")}</span><span class="row-body"><span class="row-title">${esc(o.t)}</span>${fb?`<span class="fb">${fb}</span>`:""}</span></label>`;}).join("")}</div>
      </fieldset><div id="err" aria-live="polite"></div></div>`;
    if(checked){
      const score = multi ? `${stage.options.filter((o,i)=>a.includes(i)===o.ok).length} of ${stage.options.length} right` : (stage.options[a]?.ok ? "Strong choice" : "Worth another look");
      result = `<section class="result" aria-labelledby="res-h"><h2 id="res-h" tabindex="-1">${esc(stage.resultTitle)} <span class="score">· ${score}</span></h2>${whyHTML}</section>`;
    }
  } else {
    result = `<section class="result" aria-labelledby="res-h"><h2 id="res-h" tabindex="-1">How you did</h2><div class="group">${debriefRows(SC, st)}</div>${whyHTML}
      <h2 class="group-header">Related lessons</h2><div class="group">${SC.lessons.map(id=>row({href:"#lesson-"+id, iconId:"learn", title:esc(L(id).title), sub:`${L(id).track} · ${ST_TEXT[lessonStatus(id)]}`})).join("")}</div>
      <div class="group" style="margin-top:18px">${row({href:"#glossary", iconId:"gloss", title:"Glossary"})}</div>
      <button class="secondary" type="button" data-act="restart" data-id="${SC.id}" style="margin-top:22px">Start this scenario again</button></section>`;
  }
  let label;
  if(stage.kind==="debrief") label = st.done ? "Back to Practise" : stage.finish;
  else if(!checked) label = stage.check;
  else label = SC.stages[st.stage+1].reveal;
  return {title:SC.short, large:false, body:`<p class="eyebrow">${SC.track} scenario</p>
  <h1 class="title2" tabindex="-1">${esc(SC.title)}</h1>
  <p class="stage-ind" id="stage-ind"><strong>${esc(stage.name)}</strong> · ${st.stage+1} of ${n}</p>
  <div class="stage-bar" style="grid-template-columns:repeat(${n},1fr)" aria-hidden="true">${SC.stages.map((_,i)=>`<i class="${i<=st.stage?"on":""}"></i>`).join("")}</div>
  ${explainHTML()}
  ${top}${task}${result}
  <div class="actionbar"><button class="primary" type="button" data-act="primary" data-id="${SC.id}" id="primary-btn">${esc(label)}</button></div>`};
};

function textCoverage(stage, v){ const t = (v||"").toLowerCase(); return stage.model.map(m => m.kw.some(k => t.includes(k))); }
function debriefRows(SC, st){
  return SC.stages.map((sg,i) => {
    if(sg.kind==="text"){ const c = textCoverage(sg, st.ans[i]); const k = c.filter(Boolean).length; const ok = k===c.length;
      return `<div class="row static"><span class="status st-${ok?"done":"prog"}">${icon(ok?"done":"prog")}</span><span class="row-body"><span class="row-title">${esc(sg.name)}</span><span class="row-sub">${k} of ${c.length} priorities covered</span></span></div>`; }
    if(sg.kind==="choice"){ const ok = sg.options[st.ans[i]]?.ok;
      return `<div class="row static"><span class="status st-${ok?"done":"prog"}">${icon(ok?"done":"prog")}</span><span class="row-body"><span class="row-title">${esc(sg.name)}</span><span class="row-sub">${ok?"Recommended structure":"Different from the recommended structure"}</span></span></div>`; }
    if(sg.kind==="multi"){ const a = st.ans[i]||[]; const k = sg.options.filter((o,j)=>a.includes(j)===o.ok).length; const ok = k===sg.options.length;
      return `<div class="row static"><span class="status st-${ok?"done":"prog"}">${icon(ok?"done":"prog")}</span><span class="row-body"><span class="row-title">${esc(sg.name)}</span><span class="row-sub">${k} of ${sg.options.length} decisions right</span></span></div>`; }
    return "";
  }).join("");
}

/* ---------- Render ---------- */
const navbar = document.getElementById("navbar"), view = document.getElementById("view"), tabbar = document.getElementById("tabbar");
let io;
function render({focus=false, keepScroll=null} = {}){
  const name = currentName(); const r = parse(name);
  cur = name; const tab = TAB[r.v]; S.tabRoutes[tab] = name; save();
  const out = V[r.v](r);
  const b = backTarget();
  navbar.className = "navbar" + (out.large ? "" : " inline");
  navbar.innerHTML = `<div class="nav-inner">
    <div class="nav-side left">${b?`<button class="nav-btn" type="button" data-act="back" id="nav-back">${icon("chev-l")}<span><span class="sr-only">Back to </span>${esc(titleOf(b.name))}</span></button>`:""}</div>
    <div class="nav-title" aria-hidden="true">${esc(out.title)}</div>
    <div class="nav-side right">${out.right||""}</div></div>`;
  view.innerHTML = `<div class="col">${out.body}</div>`;
  document.title = out.title==="Today" ? "Command Notebook" : `${out.title} · Command Notebook`;
  tabbar.querySelectorAll(".tab").forEach(t => { const on = t.dataset.tab===tab; if(on) t.setAttribute("aria-current","page"); else t.removeAttribute("aria-current"); t.href = "#"+(on? (tab) : S.tabRoutes[t.dataset.tab]); });
  measure(); watchActionbar();
  const y = keepScroll ?? (out.focus ? null : (S.scroll[name] ?? 0));
  if(y!=null) window.scrollTo(0, y);
  if(io) io.disconnect(); document.body.classList.remove("nav-scrolled");
  const h1 = view.querySelector("h1");
  if(out.large && h1 && "IntersectionObserver" in window){
    io = new IntersectionObserver(([e]) => { const s = !e.isIntersecting; navbar.classList.toggle("scrolled", s); document.body.classList.toggle("nav-scrolled", s); },
      {rootMargin:`-${navbar.offsetHeight + (parseFloat(getComputedStyle(document.documentElement).paddingTop)||0)}px 0px 0px 0px`});
    io.observe(h1);
  } else if(!out.large) document.body.classList.add("nav-scrolled");
  if(out.focus){ const el = document.getElementById(out.focus); if(el){ el.scrollIntoView({block:"center"}); el.classList.add("flash"); if(focus) el.focus({preventScroll:true}); return; } }
  if(focus && h1) h1.focus({preventScroll:true});
}
function rerender(){ const y = scrollY; const fid = document.activeElement?.id; render({keepScroll:y}); if(fid){ const el = document.getElementById(fid); if(el) el.focus({preventScroll:true}); } }
let abObs;
function watchActionbar(){ if(abObs) abObs.disconnect(); const ab = view.querySelector(".actionbar"); if(!ab || !("IntersectionObserver" in window)) return;
  const sentinel = document.createElement("div"); sentinel.setAttribute("aria-hidden","true"); ab.after(sentinel);
  abObs = new IntersectionObserver(([e]) => ab.classList.toggle("stuck", !e.isIntersecting), {rootMargin:`0px 0px -${tabbar.getBoundingClientRect().height}px 0px`});
  abObs.observe(sentinel); }
function measure(){ const h = tabbar.getBoundingClientRect().height; document.documentElement.style.setProperty("--tabbar-space", h+"px"); }
addEventListener("resize", measure);

/* ---------- Sheets ---------- */
const sheet = document.getElementById("sheet"); let sheetOpener = null, sheetScroll = 0;
function openSheet(html, opener){
  sheetOpener = opener?.id || null;
  sheet.innerHTML = `<div class="grabber" aria-hidden="true"></div>${html}`;
  sheetScroll = scrollY;
  if(typeof sheet.showModal==="function") sheet.showModal(); else sheet.setAttribute("open","");
  const first = sheet.querySelector('[aria-checked="true"]') || sheet.querySelector("button, textarea");
  first && first.focus({preventScroll:true});
  if(scrollY !== sheetScroll) window.scrollTo(0, sheetScroll);
}
function closeSheet(){ if(sheet.open) sheet.close(); }
sheet.addEventListener("close", ()=>{ const el = sheetOpener && document.getElementById(sheetOpener); el && el.focus({preventScroll:true}); });
sheet.addEventListener("click", e => { if(e.target===sheet) closeSheet(); });
function levelSheet(opener){
  openSheet(`<div class="sheet-head"><h2 id="sheet-title">Explain at</h2><button class="nav-btn" type="button" data-act="close-sheet">Done</button></div>
  <p class="desc">Changes how much background each explanation includes. Your place and answers stay as they are.</p>
  <div class="group" role="radiogroup" aria-labelledby="sheet-title">${LEVEL_ORDER.map(k=>`<button class="row" type="button" role="radio" aria-checked="${S.level===k}" data-level="${k}">
    <span class="row-body"><span class="row-title">${esc(LEVELS[k].name)}</span><span class="row-sub">${esc(LEVELS[k].desc)}</span></span>${icon("check","check")}</button>`).join("")}</div>`, opener);
}
function exportData(){ return JSON.stringify({app:"Command Notebook", exported:new Date().toISOString(), progress:{track:S.track, level:S.level, lessons:S.lessons, scenarios:S.scen, review:S.cards}}, null, 2); }
function exportSheet(opener){
  const json = exportData();
  openSheet(`<div class="sheet-head"><h2 id="sheet-title">Export progress</h2><button class="nav-btn" type="button" data-act="close-sheet">Done</button></div>
  <p class="desc">Save the file to Files or send it to yourself. It contains only your progress in this app.</p>
  <div class="group">${row({act:"share-file", iconId:"share", title:"Save or share file", sub:"command-notebook-progress.json", cls:"action"})}
  ${row({act:"copy-export", iconId:"copy", title:"Copy as text", cls:"action", id:"copy-btn"})}</div>
  <label class="sr-only" for="export-text">Exported progress</label>
  <textarea id="export-text" readonly style="margin-top:14px">${esc(json)}</textarea>`, opener);
}
function resetSheet(opener){
  openSheet(`<div class="sheet-head"><h2 id="sheet-title">Reset all progress?</h2><span></span></div>
  <p class="desc">This clears completed lessons, scenario answers and your review schedule on this iPhone. It can't be undone. Export first if you want a copy.</p>
  <div class="group">${row({act:"do-reset", title:"Reset progress", cls:"danger"})}</div>
  <div class="group" style="margin-top:10px">${row({act:"close-sheet", title:"Cancel", cls:"center action"})}</div>`, opener);
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("a[href^='#']");
  if(a && !e.defaultPrevented && !e.metaKey && !e.ctrlKey){
    e.preventDefault(); const name = a.getAttribute("href").slice(1);
    const tab = a.dataset.tab;
    if(tab){ const curTab = TAB[parse(cur).v];
      if(curTab===tab){ if(cur!==tab) go(tab, {replace:true}); else window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
      else go(S.tabRoutes[tab] || tab);
      return; }
    if(a.hasAttribute("data-back")){ goBack(); return; }
    go(name); return;
  }
  const b = e.target.closest("[data-act],[data-level]"); if(!b) return;
  if(b.dataset.level){ S.level = b.dataset.level; save(); closeSheet(); window.scrollTo(0, sheetScroll); rerender(); announce(`Explaining at ${LEVELS[S.level].name} level`); return; }
  const act = b.dataset.act;
  if(act==="back") goBack();
  else if(act==="level") levelSheet(b);
  else if(act==="close-sheet") closeSheet();
  else if(act==="export") exportSheet(b);
  else if(act==="reset") resetSheet(b);
  else if(act==="do-reset"){ const keep = {track:S.track, level:S.level}; S = Object.assign(fresh(), keep); RQ = null; flush(); closeSheet(); rerender(); announce("Progress reset"); }
  else if(act==="copy-export"){ const ta = document.getElementById("export-text"); const done = () => { b.querySelector(".row-title").textContent = "Copied"; announce("Copied"); };
    (navigator.clipboard?.writeText(ta.value) ?? Promise.reject()).then(done).catch(()=>{ ta.focus(); ta.select(); announce("Text selected. Use Copy from the menu."); }); }
  else if(act==="share-file") shareFile();
  else if(act==="complete"){ const id = b.dataset.id; const d = !S.lessons[id]?.done; S.lessons[id] = Object.assign({}, S.lessons[id], {done:d, at:now()}); save(); rerender(); announce(d?"Lesson marked complete":"Lesson marked not done"); }
  else if(act==="show"){ RQ.shown = true; rerender(); document.getElementById("ra")?.focus(); }
  else if(act==="knew" || act==="again"){ const id = RQ.q[RQ.i]; const c = S.cards[id] || {iv:0};
    if(act==="knew"){ c.iv = c.iv ? Math.min(c.iv*2.5, 60) : 2; c.due = now() + c.iv*864e5; RQ.done++; }
    else { c.iv = 0; c.due = now() + 10*60e3; RQ.q.push(id); }
    S.cards[id] = c; RQ.i++; RQ.shown = false; save(); render({keepScroll:0}); view.querySelector("#rq, h1")?.focus(); }
  else if(act==="primary") primary(b.dataset.id);
  else if(act==="restart"){ S.scen[b.dataset.id] = {stage:0, ans:{}, checked:{}, done:false}; save(); S.scroll[cur]=0; render({keepScroll:0, focus:true}); announce("Scenario restarted at the briefing"); }
});
sheet.addEventListener("keydown", e => {
  const radios = [...sheet.querySelectorAll('[role="radio"]')]; const i = radios.indexOf(document.activeElement);
  if(i<0) return;
  if(e.key==="ArrowDown"||e.key==="ArrowRight"){ e.preventDefault(); radios[(i+1)%radios.length].focus(); }
  if(e.key==="ArrowUp"||e.key==="ArrowLeft"){ e.preventDefault(); radios[(i-1+radios.length)%radios.length].focus(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(t.name==="track"){ S.track = t.value; RQ = null; save(); rerender(); announce(`${t.value} selected`); return; }
  if(t.dataset.opt){ const id = t.dataset.opt, st = sc(id), stage = SCENARIOS[id].stages[st.stage];
    if(stage.kind==="multi") st.ans[st.stage] = [...document.querySelectorAll(`input[name="${t.name}"]:checked`)].map(x => +x.value);
    else st.ans[st.stage] = +t.value;
    if(st.checked[st.stage]){ st.checked[st.stage] = false; save(); rerender(); } else save(); }
});
document.addEventListener("input", e => { const t = e.target; if(t.dataset.ans){ const st = sc(t.dataset.ans); st.ans[st.stage] = t.value; save(); } });
document.addEventListener("toggle", e => { if(e.target.id?.startsWith("ref-")){ S.open[e.target.id.slice(4)] = e.target.open; save(); } }, true);

function primary(id){
  const SC = SCENARIOS[id], st = sc(id), stage = SC.stages[st.stage];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(stage.kind==="debrief"){ if(!st.done){ st.done = true; st.at = now(); save(); announce("Scenario complete"); } goBack(); return; }
  if(!st.checked[st.stage]){
    const a = st.ans[st.stage]; const empty = stage.kind==="text" ? !(a||"").trim() : stage.kind==="multi" ? !(a||[]).length : a==null;
    if(empty){ const err = document.getElementById("err");
      err.innerHTML = `<p class="err">${icon("warn","sm")}<span>${stage.kind==="text"?"Write at least one line first.":"Choose an answer first."}</span></p>`;
      (view.querySelector(".field") || view.querySelector(".opt input"))?.focus(); return; }
    st.checked[st.stage] = true; save(); rerender();
    const h = document.getElementById("res-h"); if(h){ h.scrollIntoView({block:"start", behavior: reduce?"auto":"smooth"}); h.focus({preventScroll:true}); }
    return;
  }
  st.stage++; save(); S.scroll[cur] = 0;
  render({keepScroll:0}); document.getElementById("stage-ind")?.setAttribute("tabindex","-1"); document.getElementById("stage-ind")?.focus({preventScroll:true});
  announce(`${SC.stages[st.stage].name}, stage ${st.stage+1} of ${SC.stages.length}`);
}
async function shareFile(){
  const json = exportData(); const name = "command-notebook-progress.json";
  try{ const file = new File([json], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Command Notebook progress"}); return; } }catch(e){ if(e.name==="AbortError") return; }
  try{ const url = URL.createObjectURL(new Blob([json],{type:"application/json"})); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); announce("File saved"); }
  catch(e){ announce("Saving isn't available here. Use Copy as text."); }
}

/* Keyboard: keep fixed controls from covering text */
const coarse = matchMedia("(pointer: coarse)").matches;
function kb(){ const vv = window.visualViewport; const open = vv ? (innerHeight - vv.height > 140) : false;
  const typing = coarse && document.activeElement?.matches?.("textarea, input[type=text]");
  document.body.classList.toggle("kb-open", open || !!typing); }
window.visualViewport?.addEventListener("resize", kb);
document.addEventListener("focusin", kb); document.addEventListener("focusout", ()=>setTimeout(kb, 50));

/* Launch */
(function boot(){
  const standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  if(standalone) document.documentElement.classList.add("standalone");
  const name = currentName();
  history.replaceState({prev: history.state?.prev ?? null}, "", "#"+name);
  render();
  if("serviceWorker" in navigator && location.protocol==="https:" && !/claude/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
